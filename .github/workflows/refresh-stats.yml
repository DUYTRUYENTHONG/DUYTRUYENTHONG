name: Refresh GitHub profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Render stats from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/render_stats.py
      - name: Commit refreshed card
        run: |
          if ! git diff --quiet -- assets/github-stats.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/github-stats.svg
            git commit -m "chore: refresh GitHub profile stats"
            git push
          fi
